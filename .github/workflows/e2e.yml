name: Playwright E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ASP.NET app with SQLite and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      DOTNET_CONFIGURATION: Release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Restore application dependencies
        run: dotnet restore

      - name: Build application
        run: dotnet build --configuration "$DOTNET_CONFIGURATION" --no-restore

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Playwright's webServer starts the ASP.NET process and waits for it to
      # become ready. The process migrates/seeds an isolated SQLite database.
      - name: Run Playwright E2E tests
        run: npm test

      - name: Upload Playwright reports and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
